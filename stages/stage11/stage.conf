#!/usr/bin/env bash
STAGE_NAME="How Linux Is Built"
STAGE_NUMBER=11
STAGE_DESCRIPTION="Stop typing commands for a moment and look at what is underneath them."

STAGE_COMMANDS="uname python3 strace file ldd id"
STAGE_SYNTAX="chaining substitution"

# The OS stages are about inspecting the running system, and that lives in /proc.
STAGE_SYSTEM_PATHS="/proc /sys/devices/system/cpu /etc/passwd /etc/group /etc/os-release"

STAGE_SECTIONS="A B"

SECTION_A_NAME="The Layers"
SECTION_A_LESSONS="01_uname 02_kernel_userspace 03_syscalls 04_shell_is_a_program"
SECTION_A_MISSION="layers_mission"

SECTION_B_NAME="What Happens When You Type ls"
SECTION_B_LESSONS="05_fork_exec 06_path_lookup 07_proc_self"
SECTION_B_MISSION="trace_mission"

STAGE_QUIZ_NAME="Interview Questions: Architecture"
STAGE_QUIZ_INTRO="These come up in almost every Linux interview. Answer in your own words."
STAGE_QUIZ_OUTRO="That is the shape of the system. Everything after this fills it in."
STAGE_QUIZ="01_kernel_vs_shell 02_user_vs_kernel_space 03_what_is_a_syscall 04_fork_vs_exec 05_why_ring_separation"

FINAL_MISSION="ls_journey_mission"
